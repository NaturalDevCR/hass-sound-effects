openapi: 3.1.0
info:
  title: Sound Effects Studio integration API
  version: 1.0.0
  summary: The v1 API that the sound_effects integration uses to talk to Sound Effects Studio.
  description: |
    Served by the Sound Effects Studio App on port 8099 and consumed by the `sound_effects`
    Home Assistant integration. Every endpoint requires the App's API token as a bearer token.

    All JSON uses snake_case. Timestamps are ISO-8601 UTC strings that end in `Z`. Errors use
    the `{"detail": "<human message>"}` shape of the `Error` schema.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://{host}:{port}
    description: Sound Effects Studio App, reached directly on the Home Assistant network.
    variables:
      host:
        default: localhost
      port:
        default: "8099"
security:
  - bearerAuth: []
tags:
  - name: integration
    description: Endpoints used by the sound_effects integration.
paths:
  /api/v1/health:
    get:
      tags: [integration]
      operationId: getHealth
      summary: Check that the App is up and report its identity.
      responses:
        "200":
          description: The App is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/catalog:
    get:
      tags: [integration]
      operationId: getCatalog
      summary: Fetch the published catalog.
      description: |
        Returns every sound that has a published revision, whatever its current status. The
        response carries an `ETag` of the form `"rev-<revision>"`. Send it back in
        `If-None-Match` to receive `304` when the catalog has not changed.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the catalog the caller already holds.
          schema:
            type: string
      responses:
        "200":
          description: The current catalog.
          headers:
            ETag:
              description: Entity tag of this catalog revision, `"rev-<revision>"`.
              required: true
              schema:
                type: string
                examples:
                  - '"rev-42"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "304":
          description: The catalog has not changed since the revision in `If-None-Match`.
          headers:
            ETag:
              description: Entity tag of the current catalog revision.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/selections:
    post:
      tags: [integration]
      operationId: postSelections
      summary: Report which sounds the integration selected.
      description: The App uses these events to update its selection counters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionBatch"
      responses:
        "204":
          description: The events were recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The body is invalid, for example it holds more than 500 events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The App API token, shown in the Studio System view.
  responses:
    Unauthorized:
      description: The bearer token is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version, api_version, instance_id]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: The App version.
        api_version:
          type: integer
          const: 1
        instance_id:
          type: string
          description: UUID that identifies this App instance, persisted across restarts.
    Catalog:
      type: object
      required: [revision, generated_at, seasons, categories, sounds]
      properties:
        revision:
          type: integer
          description: Increments on every change that affects the published catalog.
        generated_at:
          type: string
          format: date-time
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSeason"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategory"
        sounds:
          type: array
          description: Only sounds that have a published revision.
          items:
            $ref: "#/components/schemas/CatalogSound"
    CatalogSeason:
      type: object
      required: [id, name, color, icon, start, end, priority]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        start:
          type: ["string", "null"]
          pattern: "^[0-9]{2}-[0-9]{2}$"
          description: First day of the season as `MM-DD`, inclusive. Null only for `regular`.
        end:
          type: ["string", "null"]
          pattern: "^[0-9]{2}-[0-9]{2}$"
          description: |
            Last day of the season as `MM-DD`, inclusive. Earlier than `start` when the season
            wraps the new year. Null only for `regular`.
        priority:
          type: integer
          description: When seasons overlap, the higher priority wins.
    CatalogCategory:
      type: object
      required: [id, name, icon, color, description, sort_order]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        description:
          type: string
        sort_order:
          type: integer
    CatalogSound:
      type: object
      required:
        - id
        - category_id
        - title
        - key
        - tags
        - seasons
        - all_seasons
        - enabled
        - published
      properties:
        id:
          type: string
        category_id:
          type: string
        title:
          type: string
        key:
          type: string
        tags:
          type: array
          items:
            type: string
        seasons:
          type: array
          items:
            type: string
        all_seasons:
          type: boolean
        enabled:
          type: boolean
        published:
          type: object
          required: [revision, filename, duration, mime_type]
          properties:
            revision:
              type: integer
            filename:
              type: string
              description: |
                File name under `/local/sound-effects/`, for example `<sound_id>-r<revision>.mp3`.
            duration:
              type: number
              description: Duration in seconds.
            mime_type:
              type: string
              examples:
                - audio/mpeg
    SelectionEvent:
      type: object
      required: [sound_id, category_id, season_id, selected_at]
      properties:
        sound_id:
          type: string
        category_id:
          type: string
        season_id:
          type: string
        selected_at:
          type: string
          format: date-time
    SelectionBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SelectionEvent"
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable message.
